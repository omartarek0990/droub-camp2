    <path d="M 200 428 L 208 405 L 215 405 L 214 412 C 217 406 223 403 229 405 C 235 407 238 413 236 420 C 234 427 227 431 221 429 C 216 428 213 424 212 420 L 210 428 Z M 218 422 C 222 423 227 420 228 415 C 229 411 227 408 223 407 C 219 406 215 410 214 415 C 213 419 215 421 218 422 Z" fill="#FFFFFF"/>
