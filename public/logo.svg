    <path d="M 298 448 L 308 405 L 315 405 L 314 412 C 318 406 324 403 331 405 C 337 407 340 414 338 421 C 335 429 328 433 321 430 C 317 429 314 424 313 420 L 305 448 Z M 320 423 C 324 424 329 421 330 416 C 331 411 329 408 325 407 C 321 406 317 409 316 415 C 315 419 317 422 320 423 Z" fill="#FFFFFF"/>
